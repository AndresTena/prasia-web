server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No servir archivos internos del repo (2026-10-14): .git, .claude, docs y config
  location ~ /\.(?!well-known/) { return 404; }
  location ~* \.(md|sh|ya?ml|conf)$ { return 404; }

  location = /api/lead {
    default_type application/json;
    return 200 "{}";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
